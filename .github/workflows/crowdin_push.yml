name: Crowdin push from GitHub

on:
  # Push automático desactivado: el fork no tiene credenciales Crowdin (secrets).
  # Solo se ejecuta manualmente desde Actions.
  workflow_dispatch:

jobs:
  push:
    name: Push strings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          clean: true

      - name: Push strings
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          upload_sources: true
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
